services:
  - type: web
    name: thrive-api
    runtime: node
    plan: free
    buildCommand: npx -y pnpm@9.15.0 install --frozen-lockfile --prod=false
    startCommand: npx -y pnpm@9.15.0 --filter @habits-coach/api start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        value: https://fitklsshlhjwddbxhhdi.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CLAUDE_CODE_OAUTH_TOKEN
        sync: false
      - key: COACH_MODEL
        value: claude-opus-5
