name: Daily Code Improvement

on:
  # Scheduled runs are off: /autopilot now drains Linear's Ready state from a
  # worktree, and two automations opening PRs against the same repo collide.
  # Uncomment the cron to bring this one back.
  #
  # schedule:
  #   - cron: '0 9 * * *'   # 9am UTC daily
  workflow_dispatch: # Manual trigger only

permissions:
  contents: write
  pull-requests: write

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests (baseline)
        run: |
          pnpm --filter @habits-coach/api test || true
          pnpm --filter @habits-coach/mobile test || true

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Create improvement branch
        run: |
          BRANCH_NAME="improve/daily-$(date +%Y-%m-%d)-${{ github.run_number }}"
          git checkout -b "$BRANCH_NAME"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Run Claude Code Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude --print --dangerously-skip-permissions "
          You are a code improvement agent. Your task is to find ONE small, focused improvement in this codebase.

          Focus on ONE of these improvements (pick the best opportunity you find):
          1. Remove duplicated code by extracting a shared function/utility
          2. Extract code into smaller, more testable units
          3. Simplify overly complex logic
          4. Fix any obvious bugs or issues you notice

          Rules:
          - Make only ONE improvement, keep it small and focused
          - Do NOT add new features
          - Do NOT add documentation or comments unless fixing existing ones
          - Do NOT refactor code that is already clean
          - Ensure all existing tests still pass after your changes
          - If you add new functionality, add tests for it

          After making changes:
          1. Run 'pnpm --filter @habits-coach/api test' to verify API tests pass
          2. Run 'pnpm --filter @habits-coach/mobile test' to verify mobile tests pass
          3. If tests fail, fix the issues or revert your changes

          Start by exploring the codebase to find the best improvement opportunity.
          "

      - name: Generate improvement summary
        if: ${{ !cancelled() }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude --print --dangerously-skip-permissions "
          Look at the git diff of uncommitted changes in this repo. Write a concise PR description with these sections:

          ## What was changed
          List each file modified with a one-line description.

          ## Why this improvement
          Why was this chosen over other options?

          ## How it improves the code
          Concrete benefits (reduced duplication, better testability, etc.)

          Output ONLY the markdown content, nothing else.
          " > /tmp/improvement_summary.md || echo "Could not generate summary" > /tmp/improvement_summary.md

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Run tests (verify)
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          pnpm --filter @habits-coach/api test
          pnpm --filter @habits-coach/mobile test

      - name: Commit changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "Claude Code Bot"
          git config user.email "claude-bot@users.noreply.github.com"
          git add -A
          git commit -m "$(cat <<'EOF'
          refactor: daily code improvement

          Automated improvement by Claude Code agent.

          Co-Authored-By: Claude <noreply@anthropic.com>
          EOF
          )"

      - name: Push and create PR
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push -u origin "$BRANCH_NAME"

          # Build PR body from summary + files changed
          PR_BODY=$(cat <<'HEADER'
          ## Summary

          Automated daily code improvement by Claude Code agent.

          HEADER
          )

          # Add the improvement summary
          if [ -f /tmp/improvement_summary.md ]; then
            PR_BODY="$PR_BODY
          $(cat /tmp/improvement_summary.md)
          "
          fi

          # Add files changed section
          PR_BODY="$PR_BODY
          ## Files Changed

          \`\`\`
          $(git diff --stat HEAD~1)
          \`\`\`

          ## Checklist
          - [ ] Changes look reasonable
          - [ ] Tests pass
          - [ ] No unintended side effects

          ---
          *This PR was automatically generated by the daily improvement workflow.*
          "

          gh pr create \
            --title "refactor: daily code improvement ($(date +%Y-%m-%d))" \
            --body "$PR_BODY"
