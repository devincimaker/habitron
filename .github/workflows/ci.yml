name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  # A new push supersedes the run it interrupted, except on master, where every
  # commit's run is the record of whether that commit deployed.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  gate:
    name: typecheck + lint + knip + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # Errors fail the gate; react-hooks/exhaustive-deps warnings do not yet.
      # Raise this to --max-warnings 0 once those are worked through.
      - run: pnpm lint

      # Whole-import-graph dead code: the question ESLint cannot answer, since
      # it sees one file at a time.
      - run: pnpm knip

      - run: pnpm test

  deploy:
    name: deploy migrations
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # db push compares against what is already applied, but the diff below
          # needs the previous commit to know whether migrations moved at all.
          fetch-depth: 2

      - name: Did this commit touch migrations?
        id: changed
        run: |
          if git diff --name-only HEAD~1 HEAD -- supabase/migrations/ | grep -q .; then
            echo "migrations=true" >> "$GITHUB_OUTPUT"
          else
            echo "migrations=false" >> "$GITHUB_OUTPUT"
            echo "No migration changes in this commit — nothing to deploy."
          fi

      - uses: supabase/setup-cli@v1
        if: steps.changed.outputs.migrations == 'true'
        with:
          version: latest

      # Fails loudly rather than skipping. A deploy step that quietly does
      # nothing when a secret is missing is indistinguishable from one that
      # worked, and the cost of that confusion is production schema drift.
      - name: Check deploy credentials
        if: steps.changed.outputs.migrations == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$SUPABASE_DB_PASSWORD" ] || missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::This commit adds migrations but these repo secrets are unset:$missing"
            echo "Add them with:"
            echo "  gh secret set SUPABASE_ACCESS_TOKEN"
            echo "  gh secret set SUPABASE_DB_PASSWORD"
            exit 1
          fi

      - name: Push migrations to production
        if: steps.changed.outputs.migrations == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref fitklsshlhjwddbxhhdi
          supabase db push

  deploy-api:
    name: deploy api
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-api
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build the API image here, then stream it to the box over SSH: no registry,
      # no image visibility to manage, one box to keep in sync.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          tags: habitron-api:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Ship image and deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o BatchMode=yes deploy@$DEPLOY_HOST"
          scp -i ~/.ssh/deploy_key -o BatchMode=yes deploy/compose.yml deploy/Caddyfile deploy/deploy.sh "deploy@$DEPLOY_HOST:/opt/habitron/"
          docker save habitron-api:${{ github.sha }} | gzip | $SSH 'gunzip | docker load'
          $SSH "bash /opt/habitron/deploy.sh ${{ github.sha }}"
